<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>作品探索｜昱佐 YuZuo 作品集</title>
  <meta name="description" content="瀏覽昱佐 YuZuo 的所有作品：3D 美術與 2D 插畫，可依類型、系列標籤篩選，或切換排列方式。">
  <link rel="icon" href="artworks/我的LOGO.png" type="image/png">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <script>document.documentElement.classList.add("js");</script>
</head>
<body data-page="gallery">
  <a class="skip-link" href="#main">跳至主要內容</a>

  <div id="site-header"></div>

  <main id="main" tabindex="-1">
    <div class="container page-head">
      <span class="eyebrow">Gallery</span>
      <h1 class="page-head__title">作品探索</h1>
      <p class="page-head__lead">
        自由瀏覽所有展出作品。可依作品類型或主題標籤篩選，點擊作品卡片進入詳情欣賞完整圖片與創作故事。
      </p>
    </div>

    <!-- 篩選工具列 -->
    <section class="toolbar" aria-label="作品篩選工具">
      <div class="container">
        <div class="toolbar__row">
          <div class="toolbar__group">
            <span class="toolbar__label" id="quick-label">快速篩選</span>
            <div class="chip-list" id="quick-chips" role="group" aria-labelledby="quick-label"></div>
          </div>

          <div class="toolbar__group">
            <span class="toolbar__label" id="type-label">作品類型</span>
            <div class="chip-list" id="type-chips" role="group" aria-labelledby="type-label"></div>
          </div>

          <div class="toolbar__group">
            <span class="toolbar__label" id="tag-label">主題標籤</span>
            <div class="chip-list" id="tag-chips" role="group" aria-labelledby="tag-label"></div>
          </div>

          <div class="toolbar__group">
            <label class="search-field">
              <span class="visually-hidden">搜尋作品名稱或標籤</span>
              <span aria-hidden="true">⌕</span>
              <input type="search" id="search-input" placeholder="搜尋作品名稱、標籤…" autocomplete="off">
            </label>

            <div class="layout-toggle" role="group" aria-label="作品排列方式">
              <button type="button" data-layout="grid" aria-pressed="true">規則網格</button>
              <button type="button" data-layout="editorial" aria-pressed="false">編輯式網格</button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- 結果狀態 -->
    <div class="container">
      <div class="results-bar">
        <p class="results-count" id="results-count" aria-live="polite">載入中…</p>
        <div class="active-filters" id="active-filters"></div>
      </div>

      <div id="gallery-results" aria-live="polite"></div>
    </div>
  </main>

  <div id="site-footer"></div>
  <div id="toast-region" class="toast-region" role="status" aria-live="polite" aria-atomic="true"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/artworks.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/page-gallery.js"></script>
</body>
</html>
